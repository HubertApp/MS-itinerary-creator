name: C++ CI (Lint, Tests, Coverage, Perf)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  DEPS: >-
    cmake ninja-build g++
    libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
    libgtest-dev libbenchmark-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src tests \( -iname "*.cpp" \) \
            -print0 | xargs -0 clang-format --dry-run -Werror

  build-and-test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure -L unit

      - name: Integration tests
        working-directory: build
        run: ctest --output-on-failure -L integration

  coverage:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $DEPS
          pip install --quiet gcovr

      - name: Build with coverage
        run: |
          cmake -G Ninja -B build-cov \
                -DCMAKE_BUILD_TYPE=Debug \
                -DASTAR_COVERAGE=ON
          cmake --build build-cov --parallel $(nproc)

      - name: Run tests
        working-directory: build-cov
        run: ctest --output-on-failure -L "unit|integration"

      - name: Coverage report
        env:
          THRESHOLD: "70"
        run: |
          set -euo pipefail

          count=$(find build-cov -name '*.gcda' | wc -l)
          echo "fichiers .gcda trouves : $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::aucune donnee de couverture — le build a-t-il ete fait avec -DASTAR_COVERAGE=ON, et les tests lances ensuite ?"
            exit 1
          fi

          set +e
          gcovr --root . build-cov \
                --exclude 'tests/' \
                --exclude 'build-cov/' \
                --print-summary \
                --txt coverage.txt \
                --html-details coverage.html \
                --xml coverage.xml \
                --fail-under-line "$THRESHOLD"
          status=$?
          set -e

          {
            echo '## Couverture de code'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: coverage-${{ github.sha }}
          path: coverage.*
          retention-days: 30
          if-no-files-found: warn

  performance:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Run benchmarks
        working-directory: build
        run: |
          ./perf_tests \
            --benchmark_repetitions=5 \
            --benchmark_report_aggregates_only=true \
            --benchmark_out=benchmark.json \
            --benchmark_out_format=json \
            | tee benchmark.txt

      - name: Publish results
        working-directory: build
        run: |
          {
            echo '## Tests de performance'
            echo '```'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: build/benchmark.json
          retention-days: 90

  build-and-push:

    needs: [build-and-test, coverage]


    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/astar-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/astar-service:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max