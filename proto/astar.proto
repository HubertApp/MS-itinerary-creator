syntax = "proto3";

package astar_proto;

message NodeDTO {
    int32 id = 1;
    double lat = 2;
    double lon = 3;
    bool is_transit_stop = 4;
}

message EdgeDTO {
    int32 source_id = 1;
    int32 target_id = 2;
    double weight = 3;
    double length = 4;
    int32 layer = 5;
}

message RoutingGraphSnapshot {
    repeated NodeDTO nodes = 1;
    repeated EdgeDTO edges = 2;
}

message RouteRequestDTO {
    int32 start_node_id = 1;
    int32 end_node_id = 2;
    string routing_profile = 3;
}

message PathResponse {
    repeated int32 node_ids = 1;
    double total_weight = 2;
}

service ItineraryService {
    rpc UpdateGraph(RoutingGraphSnapshot) returns (Empty);
    rpc GetPath(RouteRequestDTO) returns (PathResponse);
}

message Empty {}