version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: astar_redis
    ports:
      - "6379:6379"         
    volumes:
      - redis_data:/data  
    command: redis-server --save 60 1  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  astar:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner           
    container_name: astar_server
    ports:
      - "50051:50051"          
    environment:
      REDIS_HOST: redis        
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy  
    restart: on-failure

  unit_tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: astar_tests
    command: ["./unit_tests"]
    depends_on:
      - redis
    profiles:
      - test

volumes:
  redis_data: