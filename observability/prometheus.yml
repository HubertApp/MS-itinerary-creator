global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: astar_grpc
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]
        labels:
          service: astar

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]